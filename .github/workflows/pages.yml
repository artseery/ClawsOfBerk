name: Publish ClawsOfBerk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build Prism archive and Pages files
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          python3 scripts/prepare_direct_pack.py --base-url "${PAGES_BASE_URL%/}"
          python3 scripts/build_client.py --pack-url "${PAGES_BASE_URL%/}/pack/pack.toml"
          mkdir -p _site
          cp -R pack _site/pack
          cp -R artifacts _site/artifacts
          cp dist/ClawsOfBerk-prism.zip _site/
          cp site-index.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
